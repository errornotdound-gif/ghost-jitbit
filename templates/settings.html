<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHOST · Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg:#050505; --card:#111; --orange:#ff6a00; --text:#f0f0f0; }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:Inter,system-ui; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.card { background:var(--card); border:1px solid #222; border-radius:16px; padding:32px; width:360px; }
h1 { font-family:Syne,sans-serif; margin:0 0 20px; text-align:center; }
input { width:100%; padding:12px; margin:8px 0; border-radius:10px; border:1px solid #333; background:#0a0a0a; color:#fff; }
button { width:100%; padding:12px; margin-top:8px; border-radius:10px; border:none; background:var(--orange); color:#000; font-weight:600; cursor:pointer; }
.err { color:#ef4444; text-align:center; margin-top:8px; }
.ok { color:#22c55e; text-align:center; margin-top:8px; }
a { color:var(--orange); text-decoration:none; display:block; text-align:center; margin-top:16px; }
</style>
</head>
<body>
<div class="card">
  <h1>Settings</h1>
  <form method="post">
    <input type="password" name="old" placeholder="current password" required>
    <input type="password" name="new" placeholder="new password" required>
    <button type="submit">Update password</button>
  </form>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  {% if ok %}<div class="ok">{{ ok }}</div>{% endif %}
  <a href="/">← home</a>
</div>
</body>
</html>
