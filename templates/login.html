<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHOST - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg:#050505; --orange:#ff6a00; --text:#f0f0f0; }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:Inter,system-ui; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.bg { position:fixed; inset:0; background:radial-gradient(circle at 50% 40%, #1a0a00, transparent 55%); z-index:-1; }
.card { background:rgba(17,17,17,.85); backdrop-filter:blur(16px); border:1px solid #222; border-radius:20px; padding:36px; width:360px; }
h1 { font-family:Syne,sans-serif; font-size:2rem; margin:0 0 8px; text-align:center; }
.sub { color:#888; text-align:center; margin-bottom:24px; font-size:.9rem; }
input { width:100%; padding:12px 14px; margin:8px 0; border-radius:12px; border:1px solid #333; background:#0a0a0a; color:#fff; font-family:inherit; }
button { width:100%; padding:12px; margin-top:8px; border-radius:12px; border:none; background:var(--orange); color:#000; font-weight:600; cursor:pointer; }
.err { color:#ef4444; text-align:center; font-size:.85rem; margin-top:8px; }
.link { text-align:center; margin-top:16px; font-size:.85rem; }
.link a { color:var(--orange); text-decoration:none; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <h1>GHOST</h1>
  <p class="sub">Multi-user login</p>
  <form method="post">
    <input type="text" name="username" placeholder="username" autofocus required>
    <input type="password" name="password" placeholder="password" required>
    <button type="submit">Login</button>
  </form>
  {% if error %}<div class="err">Invalid username or password</div>{% endif %}
  {% if request.args.get('registered') %}<div style="color:#4ade80;text-align:center;margin-top:8px;font-size:.85rem;">Account created. Please login.</div>{% endif %}
  <div class="link">No account? <a href="/register">Create one</a></div>
</div>
</body>
</html>
